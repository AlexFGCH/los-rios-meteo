name: Actualizar monitor de lluvia

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 16-21,23 * * *'
    - cron: '17 1 * * *'

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: monitor-pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Actualizar fuentes de precipitacion
        env:
          NASA_PPS_EMAIL: ${{ secrets.NASA_PPS_EMAIL }}
        run: python -u scripts/actualizar_fuentes.py

      - name: Guardar resultados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar precipitacion y estado de descarga'
            git push
          fi

      - name: Preparar pagina
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -R data dist/
          test -s dist/index.html
          test -s dist/data/catalogo.json

      - uses: actions/configure-pages@v5

      - name: Subir paquete
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: dist

      - name: Publicar monitor
        id: deploy
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            let artifact;

            for (let i = 0; i < 6; i++) {
              const response = await github.rest.actions.listWorkflowRunArtifacts({
                ...repo,
                run_id: context.runId,
                per_page: 100
              });

              const matches = response.data.artifacts.filter(
                a => a.name === 'github-pages' && !a.expired
              );

              if (matches.length > 1) {
                throw new Error('Hay varios paquetes github-pages.');
              }

              if (matches.length === 1) {
                artifact = matches[0];
                break;
              }

              await new Promise(r => setTimeout(r, 10000));
            }

            if (!artifact) {
              throw new Error('No se encontro el paquete github-pages.');
            }

            const token = await core.getIDToken();
            core.setSecret(token);

            const deployment = await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments',
              {
                ...repo,
                artifact_id: artifact.id,
                pages_build_version: context.sha,
                oidc_token: token
              }
            );

            const id = deployment.data.id ||
              deployment.data.status_url?.split('/').pop();

            if (!id) {
              throw new Error('GitHub no devolvio el identificador de publicacion.');
            }

            core.setOutput('page_url', deployment.data.page_url);

            const failures = [
              'deployment_failed',
              'deployment_content_failed',
              'deployment_cancelled',
              'deployment_lost'
            ];

            for (let i = 0; i < 36; i++) {
              await new Promise(r => setTimeout(r, 10000));

              const result = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}',
                { ...repo, deployment_id: id }
              );

              const status = result.data.status;
              core.info('Estado: ' + status);

              if (status === 'succeed') {
                core.info('Monitor publicado correctamente.');
                return;
              }

              if (failures.includes(status)) {
                throw new Error('Publicacion fallida: ' + status);
              }
            }

            throw new Error('GitHub no confirmo la publicacion en seis minutos.');
